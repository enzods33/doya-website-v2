# Preview / staging Netlify — SPA + build Vite
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_INDEXABLE = "false"
  VITE_ASSETS_URL = "https://pub-5b2b2b3b50ba46c485eeff926fa26420.r2.dev"

# Fallback SPA : /panier, /commande, /admin, etc.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité (tous les chemins)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; img-src 'self' data: blob: https://pub-5b2b2b3b50ba46c485eeff926fa26420.r2.dev https://*.supabase.co; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com; frame-src https://accounts.google.com https://checkout.stripe.com"
