name: Resolve Luna Bohemia streaming links

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve album and track links from Apple Music canonical URLs
        shell: bash
        run: |
          node <<'NODE'
          const entries = [
            ['ALBUM', 'https://music.apple.com/fr/album/luna-bohemia/6812817734'],
            ['01 SOLO TÚ', 'https://music.apple.com/fr/album/solo-t%C3%BA/6812817734?i=6812817939'],
            ['02 ÁNGEL DE LA GUARDA', 'https://music.apple.com/fr/album/%C3%A1ngel-de-la-guarda/6812817734?i=6812818197'],
            ['03 GUERRIÈRES', 'https://music.apple.com/fr/album/guerri%C3%A8res/6812817734?i=6812818199'],
            ['04 CASA DE LOS LIMONEROS', 'https://music.apple.com/fr/album/casa-de-los-limoneros/6812817734?i=6812818202'],
            ['05 TODO DE MI', 'https://music.apple.com/fr/album/todo-de-mi/6812817734?i=6812818205'],
            ['06 MARIPOSA', 'https://music.apple.com/fr/album/mariposa/6812817734?i=6812818214'],
            ['07 LO VI VENIR', 'https://music.apple.com/fr/album/lo-vi-venir/6812817734?i=6812818215'],
            ['08 AHORA', 'https://music.apple.com/fr/album/ahora/6812817734?i=6812818216'],
            ['09 DÓNDE SE VA', 'https://music.apple.com/fr/album/d%C3%B3nde-se-va/6812817734?i=6812818218'],
            ['10 MUEVE', 'https://music.apple.com/fr/album/mueve/6812817734?i=6812818219'],
            ['11 LUNA BOHEMIA', 'https://music.apple.com/fr/album/luna-bohemia/6812817734?i=6812818220'],
            ['12 AMOR Y LIBERTAD', 'https://music.apple.com/fr/album/amor-y-libertad/6812817734?i=6812818221'],
          ]

          const wanted = ['spotify', 'appleMusic', 'deezer', 'youtube', 'youtubeMusic']

          for (const [label, sourceUrl] of entries) {
            const endpoint = 'https://api.song.link/v1-alpha.1/links?userCountry=FR&url=' + encodeURIComponent(sourceUrl)
            try {
              const response = await fetch(endpoint, { headers: { 'user-agent': 'doya-link-resolver/1.0' } })
              if (!response.ok) {
                console.log(JSON.stringify({ label, error: response.status }))
                continue
              }
              const data = await response.json()
              const links = {}
              for (const id of wanted) {
                const url = data.linksByPlatform?.[id]?.url
                if (url) links[id] = url
              }
              console.log(JSON.stringify({ label, sourceUrl, links }))
            } catch (error) {
              console.log(JSON.stringify({ label, error: String(error) }))
            }
            await new Promise((resolve) => setTimeout(resolve, 800))
          }
          NODE
