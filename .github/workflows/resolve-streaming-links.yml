name: Resolve Luna Bohemia streaming links

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        shell: bash
        run: |
          mkdir -p /tmp/doya-resolver
          cd /tmp/doya-resolver
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Read platform search pages
        shell: bash
        run: |
          cd /tmp/doya-resolver
          node <<'NODE'
          const { chromium } = require('playwright')

          const browser = await chromium.launch({ headless: true })
          const context = await browser.newContext({
            locale: 'fr-FR',
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
          })

          async function inspect(label, url, selectors = []) {
            const page = await context.newPage()
            console.log('\n=== ' + label + ' ===')
            console.log('URL', url)
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 })
              await page.waitForTimeout(7000)
              console.log('TITLE', await page.title())
              console.log('FINAL', page.url())
              for (const selector of selectors) {
                const rows = await page.locator(selector).evaluateAll((els) =>
                  els.slice(0, 100).map((el) => ({
                    text: (el.innerText || el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 240),
                    href: el.href || el.getAttribute('href'),
                  }))
                ).catch(() => [])
                for (const row of rows) {
                  if (/luna|bohemia|doya|solo|ángel|angel|guerr|limoner|todo de|mariposa|venir|ahora|dónde|donde|mueve|amor|libertad/i.test(row.text + ' ' + row.href)) {
                    console.log(JSON.stringify(row))
                  }
                }
              }
              const html = await page.content()
              for (const pattern of [
                /https:\/\/open\.spotify\.com\/(?:album|track)\/[A-Za-z0-9]+/g,
                /https:\/\/www\.deezer\.com\/(?:album|track)\/\d+/g,
                /https:\/\/music\.youtube\.com\/(?:browse\/[^"'&< ]+|watch\?v=[^"'&< ]+)/g,
                /https:\/\/www\.youtube\.com\/watch\?v=[^"'&< ]+/g,
              ]) {
                const found = [...new Set(html.match(pattern) || [])]
                for (const item of found.slice(0, 100)) console.log('RAW', item)
              }
            } catch (error) {
              console.log('ERROR', String(error))
            } finally {
              await page.close()
            }
          }

          await inspect(
            'SPOTIFY',
            'https://open.spotify.com/search/LUNA%20BOHEMIA%20Doya',
            ['a[href*="/album/"]', 'a[href*="/track/"]']
          )
          await inspect(
            'DEEZER',
            'https://www.deezer.com/search/LUNA%20BOHEMIA%20Doya',
            ['a[href*="/album/"]', 'a[href*="/track/"]']
          )
          await inspect(
            'YOUTUBE_MUSIC',
            'https://music.youtube.com/search?q=LUNA%20BOHEMIA%20Doya',
            ['a[href*="/browse/"]', 'a[href*="/watch"]']
          )
          await browser.close()
          NODE
