# Deploy to VPS (Hetzner) — même schéma qu’Alegria Gipsy / DojoKai.
# Push sur master → build Vite → rsync dist/ vers /var/www/…

name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Inactif par défaut. Activer cette variable uniquement au feu vert de bascule.
          VITE_SITE_URL: ${{ vars.DOYA_OFFICIAL_DOMAIN_ENABLED == 'true' && 'https://doyaofficial.com' || secrets.VITE_SITE_URL }}
          VITE_INDEXABLE: ${{ vars.DOYA_OFFICIAL_DOMAIN_ENABLED == 'true' && 'true' || 'false' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ASSETS_URL: ${{ secrets.VITE_ASSETS_URL }}

      - name: Verify SPA artifacts
        run: |
          set -e
          test -f dist/index.html
          test -f dist/404.html
          echo "SPA build OK"

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Ne pas supprimer les anciens assets hashés immédiatement :
          # un onglet déjà ouvert doit pouvoir terminer ses imports lazy après un déploiement.
          ARGS: "-rlgoDzvc -i"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
          EXCLUDE: "/node_modules/"
