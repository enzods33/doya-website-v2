name: Shop Visual Check

on:
  push:
    branches:
      - ci/shop-visual-hosted-once

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers
      npm_config_cache: /tmp/npm-cache
    steps:
      - name: Prepare temp paths
        run: mkdir -p /tmp/playwright-browsers /tmp/npm-cache /tmp/doya-visual-check

      - name: Install Playwright Chromium
        run: npx -y playwright@1.55.0 install chromium

      - name: Capture production shop
        run: >
          npx -y playwright@1.55.0 screenshot
          --browser chromium
          --viewport-size="1440,1000"
          --wait-for-timeout=5000
          --full-page
          "https://doya.guzzler-bot.cloud/#shop"
          "/tmp/doya-visual-check/shop-desktop.png"

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: doya-shop-desktop
          path: /tmp/doya-visual-check/shop-desktop.png
          if-no-files-found: error
          retention-days: 1
