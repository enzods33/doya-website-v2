name: Doya Monitoring

on:
  schedule:
    - cron: '9 * * * *'
    - cron: '24,39,54 * * * *'
  workflow_dispatch:

concurrency:
  group: doya-monitoring-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: true

jobs:
  playwright:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: monitoring/package-lock.json
      - name: Install monitoring browser once
        working-directory: monitoring
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run all read-only suites and push each result to Kuma
        working-directory: monitoring
        env:
          DOYA_BASE_URL: https://doya.guzzler-bot.cloud
          KUMA_PUSH_DOYA_PUBLIC: ${{ secrets.KUMA_PUSH_DOYA_PUBLIC }}
          KUMA_PUSH_DOYA_COMMERCE: ${{ secrets.KUMA_PUSH_DOYA_COMMERCE }}
          KUMA_PUSH_DOYA_INTEGRATIONS: ${{ secrets.KUMA_PUSH_DOYA_INTEGRATIONS }}
        run: |
          status=0
          node scripts/run-and-push.mjs public || status=1
          node scripts/run-and-push.mjs commerce || status=1
          node scripts/run-and-push.mjs integrations || status=1
          exit "$status"

  api-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalog reads and Edge preflights
        working-directory: monitoring
        env:
          DOYA_BASE_URL: https://doya.guzzler-bot.cloud
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          KUMA_PUSH_DOYA_API: ${{ secrets.KUMA_PUSH_DOYA_API }}
        run: node scripts/api-readonly.mjs
