# Contrôles front de la pull request.
# Aucun déploiement ici : la production est déployée sur le VPS Hetzner via deploy.yml.

name: Frontend CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_INDEXABLE: 'false'
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ASSETS_URL: ${{ secrets.VITE_ASSETS_URL }}
      - name: Verify SPA + SEO artifacts
        run: |
          set -e
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_redirects
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q 'index.html' dist/_redirects
          echo "SPA artifacts OK"
