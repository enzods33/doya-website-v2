# Build + contrôles SPA (preview / CI).
# Le déploiement production part sur le VPS Hetzner (voir deploy.yml).
# Secrets Netlify optionnels : NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID (staging manuel).

name: Netlify

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_INDEXABLE: 'false'
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ASSETS_URL: ${{ secrets.VITE_ASSETS_URL }}
      - name: Verify SPA + SEO artifacts
        run: |
          set -e
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_redirects
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q 'index.html' dist/_redirects
          echo "SPA artifacts OK"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy-netlify-staging:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Secrets Netlify absents — deploy ignoré."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
